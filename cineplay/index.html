<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CinePlay — Watch Movies</title>
<meta name="description" content="CinePlay — stream movies. Trending, Top 10 and more.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23E50914'/><path d='M26 20l18 12-18 12z' fill='white'/></svg>">
<link rel="stylesheet" href="css/style.css?v=20261011f">
</head>
<body>

<!-- ============ NAVBAR ============ -->
<header id="navbar">
  <a class="logo" href="index.html" aria-label="CinePlay home">
    <svg viewBox="0 0 64 64" fill="currentColor"><rect width="64" height="64" rx="12"/><path d="M26 20l18 12-18 12z" fill="#fff"/></svg>
    CinePlay
  </a>
  <nav class="nav-links">
    <a data-scroll="top" class="active">Home</a>
    <a data-cat="movie">Movies</a>
    <a data-cat="web-series">Web Series</a>
    <a data-cat="anime">Anime</a>
    <a data-scroll="mylist">My List</a>
  </nav>
  <div class="nav-spacer"></div>
  <div class="search-box" id="searchBox">
    <button id="searchToggle" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
    <input id="searchInput" type="text" placeholder="Titles, genres..." autocomplete="off">
  </div>
  <div class="avatar" title="Profile">C</div>
</header>

<!-- ============ SEARCH OVERLAY ============ -->
<div id="searchOverlay">
  <h3 id="searchLabel">Search results</h3>
  <div class="search-grid" id="searchResults"></div>
</div>

<main>
  <!-- ============ MOBILE CATEGORY BAR ============ -->
  <div class="catbar" id="catbar">
    <button data-scroll="top" class="active">Home</button>
    <button data-cat="movie">Movies</button>
    <button data-cat="web-series">Web Series</button>
    <button data-cat="anime">Anime</button>
    <button data-scroll="mylist">My List</button>
  </div>

  <!-- ============ BILLBOARD HERO ============ -->
  <section id="billboard">
    <div class="billboard-bg" id="billboardBg"></div>
    <div class="billboard-shade"></div>
    <div class="billboard-content" id="billboardContent"></div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- ============ CONTENT ROWS ============ -->
  <section id="rows"></section>

  <!-- ============ CATEGORY BROWSE ============ -->
  <section id="browseView" style="display:none">
    <div class="browse-head">
      <h2 id="browseTitle">Browse</h2>
      <button id="browseClear">✕ Clear</button>
    </div>
    <div class="browse-grid" id="browseGrid"></div>
  </section>
</main>

<div id="toast"></div>

<footer>
  <div class="f-logo">CINEPLAY</div>
  <div class="f-links">
    <a data-scroll="top">Home</a>
    <a data-cat="movie">Movies</a>
    <a data-scroll="mylist">My List</a>
  </div>
  <p>&copy; 2026 CinePlay. All rights reserved.</p>
</footer>

<script src="js/app.js?v=20261011f"></script>
</body>
</html>
